<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found - Metro Buddy</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700..800&family=Manrope:wght@400;600;700&family=IBM+Plex+Sans+Thai:wght@400;600&display=swap">
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    .nf { min-height: 80vh; display: grid; place-items: center; padding: 48px 0; }
    .nf__inner { max-width: 560px; }
    .nf__code { font-family: var(--font-head); font-weight: 800; font-size: 15px; letter-spacing: .08em; color: var(--muted); }
    .nf h1 { font-size: clamp(32px, 9vw, 52px); font-weight: 800; margin: 10px 0 12px; }
    .nf p { color: var(--ink-2); }
    .nf__track { display: flex; align-items: center; margin: 28px 0; }
    .nf__track span { height: 6px; flex: 1; border-radius: 3px; }
    .nf__track i { width: 16px; height: 16px; border-radius: 50%; border: 4px solid var(--ink); background: #fff; flex: none; margin: 0 -2px; position: relative; }
    .nf__gap { background: repeating-linear-gradient(90deg, var(--rule-strong) 0 6px, transparent 6px 12px) !important; height: 4px !important; }
    .nf__actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 20px; }
  </style>
</head>
<body style="padding-bottom:0">
  <main class="nf">
    <div class="wrap nf__inner">
      <div class="nf__code">404</div>
      <h1>This stop is not on the map</h1>
      <p>The page you are looking for does not exist. Head back and plan a route instead.</p>
      <p lang="th" style="margin-top:6px">ไม่พบหน้านี้ กลับไปหน้าหลักเพื่อวางแผนเส้นทาง</p>
      <div class="nf__track" aria-hidden="true">
        <i></i><span style="background:#7AC143"></span><span class="nf__gap"></span><span style="background:#1E4F9C"></span><i></i>
      </div>
      <div class="nf__actions">
        <a class="btn btn--primary" href="/">Back to Metro Buddy</a>
        <a class="btn" href="/#network">Network map</a>
      </div>
    </div>
  </main>
</body>
</html>
